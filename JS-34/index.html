<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="index.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
      integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <title>JS-34 Text Player</title>
  </head>
  <body>
    <div class="container">
      <div class="features-container">
        <div class="text-tranform">
          <label for="">Text-tranfrom</label><br />
          <input class="icon" type="button" value="Capitalize" />
          <input class="icon" type="button" value="Uppercase" />
          <input class="icon" type="button" value="Lowercase" />
          <input class="icon" type="button" value="Toggle" />
        </div>
        <div class="font-size">
          <label for="">Font-size</label><br />
          <input type="button" value="A+" class="size-icon" />
          <input type="button" value="A-" class="size-icon" />
        </div>
        <div class="font-weight">
          <label for="">Font-weight</label><br />
          <input type="button" value="Bold" class="weight-icon" />
          <input type="button" value="Italic" class="weight-icon" />
          <input type="button" value="underline" class="weight-icon" />
        </div>
      </div>
      <div class="value">
        <label for="para">Enter your text over here.</label><br />
        <textarea name="values" id="para" rows="15" cols="50"></textarea>
      </div>
    </div>
    <script src="index.js"></script>
  </body>
</html>
